<!DOCTYPE html>
<html>
<head>
    <title>Edit Admin Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-body">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">
            🎓
            <span>Student Management<br>System</span>
        </div>

        <a href="/dashboard" class="menu">
            🏠 Dashboard
        </a>

        <a href="/add_student" class="menu">
            👤 Add Student
        </a>

        <a href="/students" class="menu">
            👥 View Students
        </a>

        <a href="/search" class="menu">
            🔍 Search Student
        </a>

        <a href="/admin_profile" class="menu active">
            ⚙️ Admin Profile
        </a>

        <a href="/logout" class="menu logout-menu">
            🚪 Logout
        </a>

    </div>


    <!-- Main Content -->
    <div class="main-content">

        <div class="top-bar">

            <div>
                <h1>Edit Admin Profile</h1>
                
            </div>

            <div class="admin">
                👤 Welcome, Admin
            </div>

        </div>


        <!-- Back Button -->
        <a href="/admin_profile" class="back-button">
            ← Back to Profile
        </a>


        <!-- Edit Profile Card -->
        <div class="form-card">

            <div class="form-heading">

                <div style="font-size: 55px;">
                    👤
                </div>

                <h2>Edit Profile</h2>

                
            </div>


            <form method="POST" action="/edit_admin">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                     type="text"
                     id="name"
                     name="name"
                      placeholder="Enter your name"
                      value="{{ admin['name'] }}"
                      required
                     >

                </div>


                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    value="{{ admin['username'] }}"
                    required
                 >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    value="{{ admin['email'] }}"
                    required
                 >

                </div>


                <!-- Buttons -->
                <div class="form-buttons">

                   

                    <button
                        type="submit"
                        class="submit-button">
                        💾 Save Changes
                    </button>

                </div>

            </form>

        </div>


        <footer>
            ©️ 2026 Student Management System.
            All rights reserved.
        </footer>

    </div>

</body>
</html>
