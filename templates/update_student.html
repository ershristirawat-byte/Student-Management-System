<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-body">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">
            🎓
            <span>Student Management<br>System</span>
        </div>

        <a href="/dashboard" class="menu">
            🏠 Dashboard
        </a>

        <a href="/add_student" class="menu">
            👤 Add Student
        </a>

        <a href="/students" class="menu active">
            ✏️ Update Student
        </a>

        <a href="/students" class="menu">
            👥 View Students
        </a>

        <a href="/search" class="menu">
            🔍 Search Student
        </a>

        <a href="/logout" class="menu logout-menu">
            🚪 Logout
        </a>

    </div>


    <!-- Main Content -->
    <div class="main-content">

        <div class="top-bar">

            <div>
                <h1>Update Student</h1>
                <p>Edit and update student information</p>
            </div>

            <div class="admin">
                👤 Welcome, Admin
            </div>

        </div>


        <!-- Back Button -->
        <a href="/students" class="back-button">
            ← Back to Student List
        </a>


        <!-- Update Form -->
        <div class="form-card">

            <div class="form-heading">

                <h2>Student Information</h2>


            </div>


            <form method="POST">


                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ student['name'] }}"
                        required
                    >

                </div>


                <!-- Roll Number -->
                <div class="form-group">

                    <label for="roll_number">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="roll_number"
                        name="roll_number"
                        value="{{ student['roll_number'] }}"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ student['email'] }}"
                        required
                    >

                </div>


                <!-- Course -->
                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        name="course"
                        value="{{ student['course'] }}"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="{{ student['phone'] or '' }}"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <!-- Gender -->
                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender" name="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male"
                            {% if student['gender'] == 'Male' %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if student['gender'] == 'Female' %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if student['gender'] == 'Other' %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>


                <!-- Date of Birth -->
                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        value="{{ student['dob'] or '' }}"
                        required
                    >

                </div>


                <!-- Buttons -->
                <div class="form-buttons">

                    <button type="submit" class="submit-button">
                        ✏️ Update Student
                    </button>

                </div>

            </form>

        </div>


        <footer>
            ©️ 2026 Student Management System. All rights reserved.
        </footer>

    </div>

</body>
</html>
